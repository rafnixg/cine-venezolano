<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo curado de películas, cortometrajes y documentales venezolanos disponibles en YouTube.">
  <meta name="author" content="Cine Venezolano">
  <meta name="keywords" content="cine venezolano, películas venezolanas, cortometrajes venezolanos, documentales venezolanos, cine en YouTube">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#151310">
  <title>{% block title %}Cine Venezolano{% endblock %}</title>
  <link rel="canonical" href="{{ request.url.scheme }}://{{ request.url.netloc }}{{ request.url.path }}">
  <meta property="og:locale" content="es_VE">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cine Venezolano">
  <meta property="og:title" content="{% block og_title %}Cine Venezolano — Catálogo de cine venezolano{% endblock %}">
  <meta property="og:description" content="Catálogo curado de películas, cortometrajes y documentales venezolanos disponibles en YouTube.">
  <meta property="og:url" content="{{ request.url.scheme }}://{{ request.url.netloc }}{{ request.url.path }}">
  <meta property="og:image" content="{{ url_for('static', path='/seo/cine-venezolano-og.png') }}">
  <meta property="og:image:width" content="1536">
  <meta property="og:image:height" content="864">
  <meta property="og:image:alt" content="Cine Venezolano — Archivo audiovisual abierto">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}Cine Venezolano — Catálogo de cine venezolano{% endblock %}">
  <meta name="twitter:description" content="Películas, cortometrajes y documentales venezolanos disponibles en YouTube.">
  <meta name="twitter:image" content="{{ url_for('static', path='/seo/cine-venezolano-og.png') }}">
  <script type="application/ld+json">{{ {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Cine Venezolano",
    "url": request.url.scheme ~ "://" ~ request.url.netloc,
    "description": "Catálogo curado de películas, cortometrajes y documentales venezolanos disponibles en YouTube.",
    "inLanguage": "es-VE",
    "sameAs": ["https://www.youtube.com/playlist?list=PLVQ42obHL2u_nJgblVTpWs3NQdD_WZkAM", "https://github.com/rafnixg/cine-venezolano"]
  } | tojson }}</script>
  <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
  <script defer src="https://umami.rafnixg.dev/script.js" data-website-id="b7bc7232-1795-4dd6-b347-ac502848b802"></script>
  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Ir al catálogo">
      <span class="brand-mark">CV</span>
      <span>Cine Venezolano</span>
    </a>
    <nav aria-label="Navegación principal">
      <a href="/#catalogo">Explorar</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div>
      <p>Una ventana al cine hecho en Venezuela.</p>
      <p>Playlist original y curaduría: <a href="https://www.youtube.com/@danielacarryon" target="_blank" rel="noopener">Daniela Carrión ↗</a>.</p>
      <p>Los videos pertenecen a sus respectivos canales y se reproducen desde YouTube.</p>
    </div>
    <nav aria-label="Información legal">
      <a href="https://www.youtube.com/playlist?list=PLVQ42obHL2u_nJgblVTpWs3NQdD_WZkAM" target="_blank" rel="noopener">Playlist original ↗</a>
      <a href="https://github.com/rafnixg/cine-venezolano" target="_blank" rel="noopener">Código fuente ↗</a>
      <a href="https://github.com/rafnixg/cine-venezolano/blob/main/LICENSE" target="_blank" rel="noopener">AGPL-3.0-or-later</a>
    </nav>
  </footer>
</body>
</html>
