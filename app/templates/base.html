<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo curado de películas, cortometrajes y documentales venezolanos disponibles en YouTube.">
  <title>{% block title %}Cine Venezolano{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Ir al catálogo">
      <span class="brand-mark">CV</span>
      <span>Cine Venezolano</span>
    </a>
    <nav aria-label="Navegación principal">
      <a href="/#catalogo">Explorar</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <p>Una ventana al cine hecho en Venezuela.</p>
    <p>Los videos se reproducen desde YouTube y pertenecen a sus respectivos canales.</p>
  </footer>
</body>
</html>
