name: Container

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "alembic/**"
      - "alembic.ini"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "alembic.ini"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: cine-venezolano:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and verify HTTP endpoints
        run: |
          docker run --detach --name cine-venezolano-ci --publish 8000:8000 cine-venezolano:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then
              curl --fail --silent http://127.0.0.1:8000/ > /dev/null
              curl --fail --silent http://127.0.0.1:8000/admin/login > /dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs cine-venezolano-ci
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker logs cine-venezolano-ci || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force cine-venezolano-ci || true

  publish:
    if: github.event_name == 'push'
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
